include:
  - component: $CI_SERVER_FQDN/quiqqer/stabilization/ci-cd-components/quiqqer-package-bundle/quiqqer-package-bundle@main
    inputs:
      php-82: false
      php-83: false
      php-84: false
      php-85: false

# QUI is a JavaScript package; PHP checks do not apply.
phpcs:
  rules:
    - when: never

phpstan:
  rules:
    - when: never

# The bundle's Semgrep rules only check PHP database access and database.xml.
semgrep:
  rules:
    - when: never
